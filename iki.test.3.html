<script>
var $=function(i){return document.getElementById(i)};
var today=function(){return new Date().toISOString().slice(0,10)};

var S={xp:0,coins:0,streak:0,best:0,chest:0,av:"🧙",pet:"",own:["av:🧙"],c:{},cl:{},lc:{},snd:1,mus:0,name:"",sec:0,ses:0,first:Date.now(),day:"",ds:0};
try{var z=JSON.parse(localStorage.getItem("ck2"));if(z)S=Object.assign(S,z)}catch(e){}
S.c=Object.assign({},C0,S.c);
var dirty=1;
var DB=null,UID=null,OWN=false;
var localId="loc_"+(S.first||Date.now());

function saveLocalRoster(){try{var p=playerPayload(),map=JSON.parse(localStorage.getItem("ck2_players")||"{}");map[p.id]=p;localStorage.setItem("ck2_players",JSON.stringify(map))}catch(e){}}
function save(){dirty=1;try{localStorage.setItem("ck2",JSON.stringify(S))}catch(e){}saveLocalRoster()}
var shuf=function(a){return a.map(function(x){return[Math.random(),x]}).sort(function(p,q){return p[0]-q[0]}).map(function(x){return x[1]})};
var esc=function(t){return String(t).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})};
var fmt=function(s){s=+s||0;return s>=3600?Math.floor(s/3600)+" h "+Math.floor(s%3600/60)+" min":Math.floor(s/60)+" min "+s%60+" s"};
var TI=["Apprenti sorcier","Chevalier du code","Grand magicien","Dragon du clavier","Légende du code"],TM=[];
function clr(){TM.forEach(clearInterval);TM=[]}

var ctx,AC=window.AudioContext||window.webkitAudioContext;
function beep(f,d){if(!S.snd||!AC)return;try{ctx=ctx||new AC();var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function good(){beep(660,.12);setTimeout(function(){beep(880,.16)},110)}
function bad(){beep(190,.25)}
function boom(){var E=["🎉","⭐","✨","🎈","🍭","🌈"];for(var i=0;i<30;i++){var s=document.createElement("span");s.className="cf";s.textContent=E[i%6];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},3000,s)}}

/* musique originale : house douce et planante (synthèse WebAudio) */
var mc,mg,dl,nb,mt=0,mn=0,ms=0,CD=[[57,60,64,67,71],[53,57,60,64,67],[48,52,55,59,62],[55,59,62,64,69]];
var fq=function(n){return 440*Math.pow(2,(n-69)/12)};
function nt(t,n,d,ty,v,fc,ec){var o=mc.createOscillator(),g=mc.createGain(),l=mc.createBiquadFilter();o.type=ty;o.frequency.value=fq(n);l.type="lowpass";l.frequency.value=fc;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.5,d/3));g.gain.linearRampToValueAtTime(0,t+d);o.connect(l);l.connect(g);g.connect(mg);if(ec)g.connect(dl);o.start(t);o.stop(t+d+.05)}
function kick(t){var o=mc.createOscillator(),g=mc.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.32)}
function hat(t){var s=mc.createBufferSource(),g=mc.createGain(),h=mc.createBiquadFilter();s.buffer=nb;h.type="highpass";h.frequency.value=7500;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(h);h.connect(g);g.connect(mg);s.start(t)}
function stp(s,t){var c=CD[s>>3&3],e=s%8;if(e%2==0)kick(t);else hat(t);
  if(e==0){c.forEach(function(n){nt(t,n,2.4,"triangle",.03,1400)});nt(t,c[0]-24,2.1,"sine",.12,300)}
  if(e==4||e==7)nt(t,c[0]-24,.45,"sine",.08,300);
  if([0,3,5,6].indexOf(e)>-1||Math.random()<.2)nt(t,c[Math.random()*5|0]+12,.5,"triangle",.045,2600,1)}
function mstart(){if(!AC||mt)return;try{if(!mc){mc=new AC();mg=mc.createGain();mg.gain.value=.55;mg.connect(mc.destination);dl=mc.createDelay();dl.delayTime.value=.402;var fb=mc.createGain();fb.gain.value=.4;dl.connect(fb);fb.connect(dl);dl.connect(mg);nb=mc.createBuffer(1,3000,mc.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<3000;i++)d[i]=Math.random()*2-1}
  mc.resume();mn=mc.currentTime+.1;ms=0;mt=setInterval(function(){while(mn<mc.currentTime+.4){stp(ms,mn);mn+=.268;ms=(ms+1)%32}},100)}catch(e){}}
function mstop(){clearInterval(mt);mt=0}
document.addEventListener("pointerdown",function(){if(S.mus&&!mt)mstart()});
document.addEventListener("visibilitychange",function(){if(document.hidden){mstop();dirty=1;sync()}else if(S.mus)mstart()});
/* décor : le héros vit dans son monde + émojis d'arrière-plan */

var BG_EM=["💻","🐞","⚡","🎮","🚀","🐍","🧩","⭐","🔑","🤖"];
function bgEmojis(){
  var spots=[["8%","14%","0s"],["24%","52%","-2s"],["42%","20%","-4s"],["64%","46%","-1s"],["80%","18%","-3s"],["15%","74%","-5s"],["50%","70%","-2.5s"],["86%","68%","-4.5s"]];
  return spots.map(function(p,i){

  var dirs=[[1,0],[0,1],[-1,0],[0,-1]]; /* 0: droite, 1: bas, 2: gauche, 3: haut */
  function drawTrk(idx,dir){
    var h="";
    for(var i=0;i<18;i++){
      var onRoad=lv.road.indexOf(i)>-1;
      var cls=i==lv.goal?"gl":onRoad?"rd":"";

  $("drun").onclick=function(){

      else if(/^droite\s*\(\s*\)$/.test(ln))steps.push("dr");
      else if(/^gauche\s*\(\s*\)$/.test(ln))steps.push("ga");

      if(act=="ga"){dir=(dir+3)%4;beep(350,.08);drawTrk(curIdx,dir);return}
      var x=curIdx%6,y=Math.floor(curIdx/6);

      var nIdx=ny*6+nx;
      if(lv.road.indexOf(nIdx)===-1){clearInterval(tm);bad();$("dmsg").textContent="🌲 Tu as quitté la route ! Utilise droite() ou gauche().";drawTrk(lv.road[0],0);return}
      curIdx=nIdx;beep(520+s*25,.08);drawTrk(curIdx,dir);
    },380);
    TM.push(tm);
  };
};
